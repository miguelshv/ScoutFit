[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scoutfit"
version = "0.12.0"
description = "Explainable player similarity with current men's LaLiga rosters and season statistics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "scikit-learn>=1.5,<2", "streamlit>=1.66,<2", "plotly>=5.24,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
scoutfit = "scoutfit.cli:main"

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/scripts", "/docs", "/assets", "/demo",
    "/.github", "/.streamlit/config.toml", "/app.py", "/pyproject.toml",
    "/uv.lock", "/README.md", "/CHANGELOG.md", "/CONTRIBUTING.md",
    "/LICENSE", "/NOTICE.md", "/.gitignore",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
